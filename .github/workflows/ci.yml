# CI para o monorepo Decyphra
# - type-check e build do site (e demo-startup-tech) rodam sempre
# - testes de integração e migrate só rodam se DATABASE_URL em Secrets começar com postgresql:// ou postgres://
# - Se "Install dependencies" falhar com erro de lockfile: rode `pnpm install` local e faça commit do pnpm-lock.yaml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Versão definida em packageManager (package.json); não definir version aqui para evitar conflito

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (site)
        run: pnpm run type-check

      - name: Build (site)
        run: pnpm run build

      - name: Build (demo-startup-tech)
        run: pnpm run build:demo-startup-tech

      - name: Check DATABASE_URL for tests
        id: check_db
        run: |
          if [ -n "$DATABASE_URL" ] && { [[ "$DATABASE_URL" == postgresql://* ]] || [[ "$DATABASE_URL" == postgres://* ]]; }; then
            echo "has_db=true" >> $GITHUB_OUTPUT
          else
            echo "has_db=false" >> $GITHUB_OUTPUT
          fi

      - name: Database migrate deploy
        if: steps.check_db.outputs.has_db == 'true'
        run: pnpm --filter site db:migrate:deploy:ci

      - name: Run tests
        if: steps.check_db.outputs.has_db == 'true'
        run: pnpm run test

      - name: Integration tests skipped
        if: steps.check_db.outputs.has_db != 'true'
        run: |
          echo "::notice::Testes de integração exigem DATABASE_URL em GitHub Secrets (postgresql:// ou postgres://). Configure em Settings > Secrets and variables > Actions."
